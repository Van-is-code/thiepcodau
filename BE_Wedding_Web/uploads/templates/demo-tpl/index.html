<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Invitation - Thiệp Cưới</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #fdf7f2; color: #2b2320; }
    .hero { position: relative; height: 62vh; min-height: 340px; overflow: hidden; }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .names { text-align: center; padding: 28px 20px 8px; }
    .names h1 { font-size: 28px; margin: 0 0 6px; font-weight: 600; }
    .amp { color: #c96547; }
    .meta { text-align: center; color: #6e625c; font-size: 14px; padding: 0 20px 20px; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
    .gallery .cell { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: #efe7dd; }
    .gallery .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bg-cell { aspect-ratio: 16 / 9; margin: 12px; border-radius: 14px;
               background-size: cover; background-position: center; background-color: #efe7dd; }
    .thanks { text-align: center; padding: 24px 22px 48px; font-size: 15px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="hero">
    <img data-image="gallery" data-image-index="0" alt="Ảnh cưới">
  </div>

  <div class="names">
    <h1><span data-field="groom_name">Chú rể</span> <span class="amp">&amp;</span> <span data-field="bride_name">Cô dâu</span></h1>
  </div>
  <div class="meta">
    <div data-field="ceremony_time_weekday"></div>
    <div data-field="venue_address"></div>
  </div>

  <div class="gallery">
    <div class="cell"><img data-image="gallery" data-image-index="1" alt="Ảnh cưới"></div>
    <div class="cell"><img data-image="gallery" data-image-index="2" alt="Ảnh cưới"></div>
  </div>

  <!-- Ô vẽ bằng CSS background-image (kiểu LadiPage) -->
  <div class="bg-cell" data-image="gallery" data-image-index="1"></div>

  <div class="thanks" data-field="thank_you_message"></div>
</body>
</html>
