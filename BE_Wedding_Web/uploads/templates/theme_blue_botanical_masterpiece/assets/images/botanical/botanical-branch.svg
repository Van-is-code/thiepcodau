<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bbSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8CBB8" />
      <stop offset="100%" stop-color="#9BAF9B" />
    </linearGradient>
    <linearGradient id="bbStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BAF9B" />
      <stop offset="100%" stop-color="#587487" />
    </linearGradient>
  </defs>

  <g id="botanical-branch">
    <!-- Main slender curved stem -->
    <path d="M50 230 Q 42 160 52 100 T 48 10" stroke="url(#bbStem)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Alternating Leaves pairs -->
    <!-- Leaf 1 (Top) -->
    <path d="M48 10 C 38 2 58 0 52 12 C 50 16 48 12 48 10 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" />
    
    <!-- Pair 1 -->
    <path d="M49 40 C 30 32 35 15 50 32 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.85" />
    <path d="M50 48 C 68 38 65 22 51 40 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.9" />

    <!-- Pair 2 -->
    <path d="M48 85 C 22 75 28 55 49 75 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.9" />
    <path d="M51 92 C 75 80 72 60 51 82 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.85" />

    <!-- Pair 3 -->
    <path d="M47 135 C 18 122 22 100 48 122 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.88" />
    <path d="M50 142 C 78 128 75 105 50 130 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.9" />

    <!-- Pair 4 -->
    <path d="M44 185 C 12 170 18 145 45 170 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.85" />
    <path d="M47 192 C 80 175 76 150 48 178 Z" fill="url(#bbSage)" stroke="#587487" stroke-width="0.5" opacity="0.85" />

    <!-- Delicate mid-ribs on main leaves -->
    <path d="M38 30 L 48 37" stroke="#46545A" stroke-width="0.4" opacity="0.4" />
    <path d="M60 32 L 51 44" stroke="#46545A" stroke-width="0.4" opacity="0.4" />
    <path d="M34 70 L 48 81" stroke="#46545A" stroke-width="0.4" opacity="0.4" />
    <path d="M65 72 L 51 88" stroke="#46545A" stroke-width="0.4" opacity="0.4" />
  </g>
</svg>

