<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 20" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="divStemFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8EA6B8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8EA6B8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#536F7C" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#536F7C" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#536F7C" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#8EA6B8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8EA6B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="fine-botanical-divider">
    <!-- Fine Horizontal Line with Gradual Fade -->
    <path d="M15 10 L 102 10 M 138 10 L 225 10" stroke="url(#divStemFade)" stroke-width="0.7" stroke-linecap="round"/>

    <!-- Left Sage Leaf -->
    <path d="M112 10 C 108 6 100 7 103 10 C 100 13 108 14 112 10 Z" fill="#9EAE98" opacity="0.8"/>
    <path d="M104 10 Q 108 9 111 10" stroke="#6F8874" stroke-width="0.3" opacity="0.6"/>

    <!-- Right Sage Leaf -->
    <path d="M128 10 C 132 6 140 7 137 10 C 140 13 132 14 128 10 Z" fill="#9EAE98" opacity="0.8"/>
    <path d="M136 10 Q 132 9 129 10" stroke="#6F8874" stroke-width="0.3" opacity="0.6"/>

    <!-- Center Tiny Blossom Node -->
    <circle cx="120" cy="10" r="3.2" fill="#FAF8F3" stroke="#536F7C" stroke-width="0.65"/>
    <circle cx="120" cy="10" r="1.5" fill="#A9C4D3"/>
    <circle cx="120" cy="10" r="0.6" fill="#D4AF37"/>
  </g>
</svg>
