<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Wax Body Radial Gradient -->
    <radialGradient id="waxRadial" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C5DBE8" />
      <stop offset="35%" stop-color="#9EBDD1" />
      <stop offset="70%" stop-color="#7B9FB5" />
      <stop offset="100%" stop-color="#55758A" />
    </radialGradient>
    
    <!-- Wax Inner Rim / Impression Gradient -->
    <radialGradient id="waxInner" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#8CAABF" />
      <stop offset="85%" stop-color="#698A9F" />
      <stop offset="100%" stop-color="#506E82" />
    </radialGradient>

    <!-- Bevel Highlights & Shadows -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2D4656" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#3D5361" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Wax Seal Outer Organic Poured Shape -->
  <g filter="url(#waxShadow)">
    <path d="M60 6 C 75 5 88 12 98 22 C 108 32 115 45 114 60 C 113 76 106 90 94 100 C 82 110 68 115 54 114 C 38 113 24 106 14 94 C 4 82 5 66 8 52 C 11 38 20 22 34 14 C 42 9 51 7 60 6 Z" fill="url(#waxRadial)" />
    <!-- Subtle outer rim bevel -->
    <path d="M60 6 C 75 5 88 12 98 22 C 108 32 115 45 114 60 C 113 76 106 90 94 100 C 82 110 68 115 54 114 C 38 113 24 106 14 94 C 4 82 5 66 8 52 C 11 38 20 22 34 14 C 42 9 51 7 60 6 Z" stroke="url(#bevelLight)" stroke-width="1.2" fill="none" opacity="0.6" />
  </g>

  <!-- Inner Embossed Recess (Stamped indentation) -->
  <circle cx="60" cy="60" r="41" fill="url(#waxInner)" stroke="#4A6677" stroke-width="1.5" />
  <!-- Inner ring ridge -->
  <circle cx="60" cy="60" r="37" stroke="#9EBDD1" stroke-width="0.8" stroke-dasharray="2 1.5" fill="none" opacity="0.7" />

  <!-- Embossed Botanical Laurel & Monogram Art -->
  <g id="embossed-botanical" stroke="#C9DDE8" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Left Laurel Wreath -->
    <path d="M42 78 C 34 70 32 50 40 40 C 42 37 45 35 48 34" />
    <path d="M37 72 C 32 72 32 66 36 68 Z" fill="#C9DDE8" fill-opacity="0.3" />
    <path d="M34 60 C 29 59 30 54 34 56 Z" fill="#C9DDE8" fill-opacity="0.3" />
    <path d="M36 48 C 32 46 34 41 38 44 Z" fill="#C9DDE8" fill-opacity="0.3" />

    <!-- Right Laurel Wreath -->
    <path d="M78 78 C 86 70 88 50 80 40 C 78 37 75 35 72 34" />
    <path d="M83 72 C 88 72 88 66 84 68 Z" fill="#C9DDE8" fill-opacity="0.3" />
    <path d="M86 60 C 91 59 90 54 86 56 Z" fill="#C9DDE8" fill-opacity="0.3" />
    <path d="M84 48 C 88 46 86 41 82 44 Z" fill="#C9DDE8" fill-opacity="0.3" />

    <!-- Center Botanical Sprig / Flower -->
    <path d="M60 74 L 60 46" stroke-width="1.2" />
    <!-- Center delicate bloom -->
    <circle cx="60" cy="44" r="3.2" fill="#E2EEF5" stroke="#698A9F" stroke-width="0.8" />
    <path d="M54 54 C 58 52 59 56 60 56 C 61 56 62 52 66 54" />
    <path d="M52 64 C 57 62 58 66 60 66 C 62 66 63 62 68 64" />
  </g>

  <!-- Embossed Lettering / Initials "M & N" below floral sprig -->
  <text x="60" y="67" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="600" fill="#E2EEF5" opacity="0.95" letter-spacing="1.5">M&amp;N</text>
</svg>

