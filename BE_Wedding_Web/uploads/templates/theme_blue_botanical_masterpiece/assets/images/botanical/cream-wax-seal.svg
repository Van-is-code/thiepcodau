<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Wax Body Radial Gradient (Cream tone from reference image) -->
    <radialGradient id="creamWaxRadial" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="45%" stop-color="#EDE4D3"/>
      <stop offset="85%" stop-color="#DFD4C0"/>
      <stop offset="100%" stop-color="#C8BCAC"/>
    </radialGradient>
    
    <!-- Inner Indentation Gradient -->
    <radialGradient id="creamInnerRecess" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#EDE2CF"/>
      <stop offset="70%" stop-color="#D8CBB5"/>
      <stop offset="100%" stop-color="#BEAF99"/>
    </radialGradient>

    <!-- Bevel Light Highlight -->
    <linearGradient id="sealBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8C7D68" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="sealDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#536F7C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#sealDropShadow)">
    <!-- Organic Hand-Poured Outer Wax Rim -->
    <path d="M50 5 C 65 4 78 10 87 20 C 96 30 98 44 96 58 C 94 72 87 84 76 92 C 65 100 48 98 35 94 C 22 90 10 80 6 66 C 2 52 4 36 12 24 C 20 12 34 6 50 5 Z" fill="url(#creamWaxRadial)"/>
    <path d="M50 5 C 65 4 78 10 87 20 C 96 30 98 44 96 58 C 94 72 87 84 76 92 C 65 100 48 98 35 94 C 22 90 10 80 6 66 C 2 52 4 36 12 24 C 20 12 34 6 50 5 Z" stroke="url(#sealBevel)" stroke-width="1" fill="none" opacity="0.7"/>

    <!-- Inner Embossed Recess -->
    <circle cx="50" cy="50" r="33" fill="url(#creamInnerRecess)" stroke="#BFAF9B" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="30" stroke="#F5EDE0" stroke-width="0.7" stroke-dasharray="1.5 1.5" fill="none" opacity="0.8"/>

    <!-- Embossed Botanical Laurel & Monogram Art -->
    <g id="embossed-botanical-crest" stroke="#8C7D6B" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85">
      <!-- Left Laurel Leaf Arc -->
      <path d="M35 64 C 28 58 27 42 34 34 C 36 32 38 30 41 29"/>
      <path d="M31 58 C 27 58 27 53 30 55 Z" fill="#8C7D6B" fill-opacity="0.25"/>
      <path d="M29 48 C 25 47 26 43 29 45 Z" fill="#8C7D6B" fill-opacity="0.25"/>

      <!-- Right Laurel Leaf Arc -->
      <path d="M65 64 C 72 58 73 42 66 34 C 64 32 62 30 59 29"/>
      <path d="M69 58 C 73 58 73 53 70 55 Z" fill="#8C7D6B" fill-opacity="0.25"/>
      <path d="M71 48 C 75 47 74 43 71 45 Z" fill="#8C7D6B" fill-opacity="0.25"/>

      <!-- Center Botanical Flower & Stem -->
      <path d="M50 62 L 50 38" stroke-width="1.1"/>
      <circle cx="50" cy="36" r="2.8" fill="#FFFDF8" stroke="#8C7D6B" stroke-width="0.8"/>
      <path d="M45 45 C 48 43 49 47 50 47 C 51 47 52 43 55 45"/>
    </g>

    <!-- Embossed Monogram Initials "M & N" -->
    <text x="50" y="56" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10.5" font-weight="600" fill="#786A58" opacity="0.9" letter-spacing="1.2">M&amp;N</text>
  </g>
</svg>

